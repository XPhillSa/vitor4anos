<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Festa do Vitor</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:#1b1b2f;color:#eee;padding:16px;min-height:100vh}
.px{font-family:'Press Start 2P',monospace}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:13px;color:#fbd000;margin:4px 0 14px;line-height:1.6}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{background:#2a2a45;border:3px solid #fff2;padding:12px 6px;text-align:center;cursor:pointer;user-select:none}.kpi div.on{background:#fbd000;border-color:#fff}.kpi div.on b,.kpi div.on small{color:#1b1b2f}.kpi div::after{content:"▾";display:block;font-size:11px;opacity:.5;margin-top:4px}.kpi div.on::after{content:"▴"}
#kdet{background:#fff8e7;color:#1b1b2f;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px 14px;margin:-6px 0 14px}#kdet h4{font-size:13px;margin-bottom:8px;color:#e52521}#kdet ul{list-style:none;display:grid;gap:4px;font-size:15px}#kdet li small{color:#666}
.kpi b{display:block;font-size:26px;color:#fbd000;line-height:1.1}
.kpi small{font-size:11px;font-weight:800;letter-spacing:.5px;line-height:1.3;display:block;margin-top:6px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,button{font:inherit;font-weight:800;padding:12px;border:3px solid #fff3;background:#2a2a45;color:#fff;border-radius:0}
button{cursor:pointer}
.b-red{background:#e52521}.b-blue{background:#049cd8}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;font-size:13px;padding:10px 4px}.tabs button.on{background:#fbd000;color:#1b1b2f}
.card{background:#fff8e7;color:#1b1b2f;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px 14px;margin-bottom:10px;border-left:10px solid #43b047}
.card.nao{border-left-color:#e52521;opacity:.85}
.card h3{font-size:17px;display:flex;justify-content:space-between;gap:8px}
.card h3 span{font-size:13px;white-space:nowrap;color:#2f8a3a}
.card.nao h3 span{color:#e52521}
.card ul{list-style:none;margin:8px 0 0;display:grid;gap:3px}
.card li{font-size:15px}
.card .meta{font-size:13px;color:#555;margin-top:8px;display:grid;gap:3px}
.card .alert{background:#ffe3e2;color:#9e1b18;font-weight:800;padding:6px 8px;margin-top:8px}
.card a{color:#049cd8}
.muted{opacity:.65;font-size:12px}
#login{background:#2a2a45;border:3px solid #fff2;padding:16px;display:grid;gap:10px}
.hide{display:none!important}
.pbox{background:#2a2a45;border:3px solid #fff2;padding:12px;display:grid;gap:10px;margin-bottom:12px}
.pbox label{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px;font-size:14px;font-weight:800}
.pbox input{padding:8px;text-align:center}
.sec{font-size:11px;color:#fbd000;margin:14px 0 8px;line-height:1.6}
table{width:100%;border-collapse:collapse;background:#fff8e7;color:#1b1b2f;border:3px solid #000;box-shadow:4px 4px 0 #000;margin-bottom:12px}
th,td{padding:8px 6px;border-bottom:1px solid #ddd;text-align:left;font-size:14px;vertical-align:top}th{background:#fbd000;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}td b{font-size:16px}td small{display:block;color:#666;font-weight:600}
.buy{background:#dff7e0!important;font-weight:900}
.fonte{font-size:12px;opacity:.7;line-height:1.5}
.sw{display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer}.sw input{width:22px;height:22px;margin:0;padding:0}tr.off td{opacity:.45}tr.off td.buy{background:#eee!important}
.pr{width:78px;padding:6px 4px;font-size:14px;background:#fff;color:#1b1b2f;border:2px solid #999}
.fn{display:block;width:78px;margin-top:4px;padding:3px 4px;font-size:11px;font-weight:600;background:#fff;color:#555;border:1px solid #bbb}
.tot{background:#dff7e0;color:#1b1b2f;border:3px dashed #43b047;padding:10px 12px;font-weight:800;margin-bottom:12px;text-align:center;font-size:16px}.tot b{font-size:22px;color:#2f8a3a}.tot small{display:block;font-weight:600;color:#555;font-size:12px}
@media print{ body{background:#fff;color:#000;padding:0} .tabs,.bar,#q,#kpi,#kdet,#avisos,#when,.pbox,.fonte,h1{display:none!important} #buy{display:block!important} table{box-shadow:none} .fn,.pr{border:0;background:none} tr.off{display:none} }
#avisos{background:#fff3c2;color:#1b1b2f;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px 14px;margin-bottom:12px}#avisos h4{font-size:13px;margin-bottom:8px;color:#9a6b00}#avisos ul{list-style:none;display:grid;gap:5px;font-size:14px}#avisos li small{color:#666}
</style>
</head>
<body><div class="wrap">
<h1 class="px">🎂 PAINEL DA FESTA DO VITOR</h1>

<div id="login" class="hide">
  <p>Digite a chave do painel (só na primeira vez neste celular):</p>
  <input id="tok" type="password" placeholder="Chave">
  <button class="b-red" id="enter">ENTRAR</button>
</div>

<div id="app" class="hide">
  <div class="kpi" id="kpi"></div><div id="kdet" class="hide"></div><div id="avisos" class="hide"></div>
  <div class="bar"><button class="b-red" id="go" style="flex:1">🔄 Atualizar</button><button class="b-blue" id="csv">⬇ CSV</button></div>
  <div class="tabs"><button data-f="sim" class="on">Vêm</button><button data-f="nao">Não vêm</button><button data-f="all">Todos</button><button data-f="buy">🛒 Compras</button></div>
  <input id="q" placeholder="Buscar nome…" style="width:100%;margin-bottom:12px">
  <div id="list"><p class="muted">Carregando…</p></div><div id="buy" class="hide"></div>
  <p class="muted" id="when" style="margin-top:10px"></p>
</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbyxvUlmLbhNzfIMGU5Q6vVX07LvLVPpnxNyIRNxr1Ytq1cuwjBv41c_Ca943CQwsxZvrA/exec';
const $=s=>document.querySelector(s); let ROWS=[], F='sim';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function getKey(){ const h=new URLSearchParams(location.hash.slice(1)).get('k'); if(h){ try{localStorage.setItem('v4_tok',h);}catch(e){} history.replaceState(null,'',location.pathname); return h; } try{ return localStorage.getItem('v4_tok')||''; }catch(e){ return ''; } }
let KEY=getKey();
async function load(){
  $('#go').textContent='⏳ Carregando…';
  try{ const j=await (await fetch(`${API}?action=list&chave=${encodeURIComponent(KEY)}`)).json();
    if(!j.ok){ try{localStorage.removeItem('v4_tok');}catch(e){} KEY=''; showLogin('Chave incorreta. Tente de novo.'); return; }
    ROWS=j.rows.slice().reverse(); DUP=[]; { const seen={}; ROWS=ROWS.filter(r=>{ const t=String(r['Telefone']||'').replace(/\D/g,'').slice(-8); if(t.length<8) return true; if(seen[t]){ DUP.push(`${esc(r['Nome'])} → ${esc(seen[t])}`); return false; } seen[t]=r['Nome']; return true; }); } if(!CFG_LOADED) loadCfg(); $('#login').classList.add('hide'); $('#app').classList.remove('hide'); render(); $('#when').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ $('#list').innerHTML='<p class="muted">Sem conexão agora. Toque em Atualizar.</p>'; }
  $('#go').textContent='🔄 Atualizar';
}
function people(r){ const s=String(r['Quem vem']||r['Nomes das crianças']||''); return s?s.split(/;\s*/).filter(Boolean):[]; }
/* Contagem real: quem respondeu + acompanhantes (sem contar duas vezes quem se colocou na lista) */
const TIT=/^(tia|tio|titia|titio|vov[óoô]|v[óoô]|dindo|dinda|madrinha|padrinho|prima|primo|fam[ií]lia)\s+/i;
const nn=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\(.*?\)/g,'').replace(/\d+\s*anos?/g,'').trim();
const core=t=>nn(t).replace(TIT,'').trim();
function head(r){ // devolve {ad, cr, extra} — extra = quem respondeu, quando não estava na lista
  const ps=people(r), novo=ps.some(p=>/\((adulto|crian)/.test(p));
  let ad=+r['Adultos']||0, cr=+r['Crianças']||0, extra=[];
  if(novo){ ad=ps.filter(p=>/\(adulto\)/.test(p)).reduce((a,p)=>a+(/\s(e|&)\s/i.test(nn(p))?2:1),0); cr=ps.filter(p=>/\(crian/.test(p)).length;
    const nome=String(r['Nome']||''); if(!/^fam[ií]lia/i.test(nome.trim())){
      const listed=ps.flatMap(p=>nn(p).split(/\s(?:e|&)\s/i).map(x=>x.replace(TIT,'').trim())); nome.split(/\s+e\s+|,|&/i).map(x=>x.trim()).filter(Boolean).forEach(pn=>{ const c=core(pn); if(c && !listed.some(l=>l===c||l.split(' ')[0]===c.split(' ')[0])) extra.push(pn); }); }
    ad+=extra.length; }
  return {ad,cr,extra};
}
function render(){
  const sim=ROWS.filter(r=>r['Presença']==='SIM'), hs=sim.map(head), ad=hs.reduce((a,h)=>a+h.ad,0), cr=hs.reduce((a,h)=>a+h.cr,0);
  const isRest=r=>r['Restrição alimentar']&&!/^n(ã|a)o$/i.test(String(r['Restrição alimentar']).trim());
  const L={ad:[],cr:[],fam:[],nao:[],rest:[]};
  sim.forEach(r=>{ const h=head(r), fam=esc(r['Nome']); h.extra.forEach(x=>L.ad.push(`${esc(x)} <small>· ${fam}</small>`));
    const ps0=people(r), novo0=ps0.some(p=>/\((adulto|crian)/.test(p)); if(!novo0){ String(r['Nome']).split(/\s+e\s+|,|&/i).map(x=>x.trim()).filter(Boolean).slice(0,+r['Adultos']||1).forEach(x=>L.ad.push(`${esc(x)} <small>· ${fam}</small>`)); ps0.forEach(p=>L.cr.push(`${esc(p)} <small>· ${fam}</small>`)); }
    else ps0.forEach(p=>{ const nm=esc(p.replace(/\s*\((adulto|crian[^)]*)\)/,'')); if(/\(crian/.test(p)){ const m=p.match(/\(crian[^)]*?,\s*([^)]+)\)/); L.cr.push(`${nm} <small>· ${m?m[1]:'idade?'} · ${fam}</small>`); } else nm.split(/\s+(?:e|&)\s+/i).forEach(x=>L.ad.push(`${x} <small>· ${fam}</small>`)); });
    L.fam.push(`${fam} <small>· ${h.ad+h.cr} pessoa${h.ad+h.cr===1?'':'s'}</small>`); if(isRest(r)) L.rest.push(`⚠️ ${esc(r['Restrição alimentar'])} <small>· ${fam}</small>`); });
  ROWS.filter(r=>r['Presença']!=='SIM').forEach(r=>L.nao.push(esc(r['Nome'])));
  KD={pes:['Todas as pessoas',[...L.ad,...L.cr]],ad:['Adultos',L.ad],cr:['Crianças',L.cr],fam:['Famílias que confirmaram',L.fam],nao:['Não vêm',L.nao],rest:['Restrições alimentares',L.rest]};
  $('#kpi').innerHTML=[['PESSOAS',ad+cr,'pes'],['ADULTOS',ad,'ad'],['CRIANÇAS',cr,'cr'],['FAMÍLIAS SIM',sim.length,'fam'],['NÃO VÊM',ROWS.length-sim.length,'nao'],['RESTRIÇÕES',L.rest.length,'rest']]
    .map(([l,v,k])=>`<div data-k="${k}" class="${KO===k?'on':''}"><b>${v}</b><small>${l}</small></div>`).join('');
  showK();
  // Avisos: tudo que precisa de atenção
  const AV=[]; const now=Date.now(), dia=86400000;
  const rec=ROWS.filter(r=>now-new Date(r['Data/Hora']).getTime()<dia); if(rec.length) AV.push(`🆕 <b>${rec.length}</b> resposta(s) nas últimas 24 h: ${rec.map(r=>esc(r['Nome'])).join(', ')}`);
  L.rest.forEach(x=>AV.push(x)); DUP.forEach(d=>AV.push(`🔁 Resposta repetida (mesmo telefone), contei só a mais recente: ${d}`));
  sim.forEach(r=>{ const ps=people(r); if(ps.some(p=>/sem nome/i.test(p))) AV.push(`✏️ ${esc(r['Nome'])} não escreveu o nome de quem vem junto <small>· conferir</small>`); if(ps.some(p=>/\(adulto\)/.test(p)&&/\s(e|&)\s/i.test(nn(p)))) AV.push(`👀 ${esc(r['Nome'])} cadastrou duas pessoas em um nome só <small>· contado como 2</small>`); if(ps.some(p=>/\(crian/.test(p)&&!/ano|beb/.test(p))) AV.push(`🎂 ${esc(r['Nome'])}: criança sem idade informada`); });
  const semTel=sim.filter(r=>!String(r['Telefone']||'').replace(/\D/g,'')).length; if(semTel) AV.push(`📵 ${semTel} família(s) sem WhatsApp cadastrado`);
  const prazo=new Date('2026-10-17T23:59:59-03:00'), fest=new Date('2026-10-24T16:00:00-03:00'); const dd=Math.ceil((fest-now)/dia); AV.push(now>prazo?`⏰ Prazo de confirmação encerrou (17/10). Festa em <b>${dd}</b> dia(s).`:`⏰ Prazo de confirmação: 17/10. Festa em <b>${dd}</b> dia(s).`);
  $('#avisos').classList.toggle('hide',F==='buy'); $('#avisos').innerHTML=`<h4>📣 AVISOS (${AV.length})</h4><ul>${AV.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  $('#buy').classList.toggle('hide',F!=='buy'); $('#list').classList.toggle('hide',F==='buy'); $('#q').classList.toggle('hide',F==='buy'); if(F==='buy'){ $('#kdet').classList.add('hide'); $('#avisos').classList.add('hide'); renderBuy(); return; }
  const q=$('#q').value.toLowerCase();
  const rows=ROWS.filter(r=>(F==='all'||(F==='sim'?r['Presença']==='SIM':r['Presença']!=='SIM')) && (!q||(String(r['Nome'])+' '+people(r).join(' ')).toLowerCase().includes(q)));
  $('#list').innerHTML=rows.map(r=>{ const s=r['Presença']==='SIM', ps=people(r), rest=String(r['Restrição alimentar']||'').trim(), tel=String(r['Telefone']||'').replace(/^'/,'');
    const h=head(r); return `<div class="card ${s?'':'nao'}"><h3>${esc(r['Nome'])}<span>${s?`✅ ${h.ad+h.cr} pessoa${h.ad+h.cr===1?'':'s'}`:'❌ não vem'}</span></h3>
      ${(h.extra.length||ps.length)?`<ul>${h.extra.map(x=>`<li>🧑 ${esc(x)} <small style="color:#888">(respondeu)</small></li>`).join('')}${ps.map(p=>`<li>${/criança/.test(p)?'🧒':'🧑'} ${esc(p.replace(/\s*\((adulto)\)/,''))}</li>`).join('')}</ul>`:''}
      ${rest&&!/^n(ã|a)o$/i.test(rest)?`<div class="alert">⚠️ ${esc(rest)}</div>`:''}
      <div class="meta">${r['Recado']?`<span>💬 ${esc(r['Recado'])}</span>`:''}${tel?`<span>📱 <a href="https://wa.me/${tel.replace(/\D/g,'')}">${esc(tel)}</a></span>`:''}<span>🕒 ${new Date(r['Data/Hora']).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div></div>`; }).join('') || '<p class="muted">Nenhuma resposta aqui ainda.</p>';
}
/* ---------- Compras: estudo de consumo (fontes: Receiteria; Guia da Semana/bufê infantil) ---------- */
const PD={extraA:0,extraC:0,marg:10,beer:50,seat:100,lemb:'c',priceSet:0,emp:20};
let P=Object.assign({},PD); try{ Object.assign(P,JSON.parse(localStorage.getItem('v4_buy')||'{}')); }catch(e){}
let ON={}, PR={salg:88,doce:140,emp:26}, FN={salg:'Pontual Doces',doce:'Pontual Doces',emp:'Pontual Doces'}; try{ ON=JSON.parse(localStorage.getItem('v4_on')||'{}'); PR=Object.assign(PR,JSON.parse(localStorage.getItem('v4_pr')||'{}')); FN=Object.assign(FN,JSON.parse(localStorage.getItem('v4_fn')||'{}')); }catch(e){}
let CFG_LOADED=false, saveT=null;
async function loadCfg(){ try{ const j=await (await fetch(`${API}?action=cfg&chave=${encodeURIComponent(KEY)}`)).json(); if(j.ok&&j.cfg&&j.cfg.P){ Object.assign(P,j.cfg.P); ON=j.cfg.ON||{}; PR=Object.assign({},PR,j.cfg.PR||{}); FN=Object.assign({},FN,j.cfg.FN||{}); } CFG_LOADED=true; if(F==='buy') renderBuy(); }catch(e){ CFG_LOADED=true; } }
const saveB=()=>{ try{ localStorage.setItem('v4_buy',JSON.stringify(P)); localStorage.setItem('v4_on',JSON.stringify(ON)); localStorage.setItem('v4_pr',JSON.stringify(PR)); localStorage.setItem('v4_fn',JSON.stringify(FN)); }catch(e){}
  const st=$('#savest'); if(st){ st.textContent='salvando…'; st.style.color='#c80'; }
  clearTimeout(saveT); saveT=setTimeout(async()=>{ try{ const r=await (await fetch(API,{method:'POST',body:JSON.stringify({action:'cfg',chave:KEY,data:{P,ON,PR,FN}})})).json(); const st=$('#savest'); if(st){ st.textContent=r.ok?'✔ salvo na nuvem':'⚠ não salvou, tente de novo'; st.style.color=r.ok?'#2f8a3a':'#c00'; } }catch(e){ const st=$('#savest'); if(st){ st.textContent='⚠ sem conexão, não salvou'; st.style.color='#c00'; } } },600); };
function ages(r){ const ps=people(r), novo=ps.some(p=>/\((adulto|crian)/.test(p)); return ps.filter(p=>!novo||/\(crian/.test(p)).map(p=>{ const m=p.match(/(\d+(?:[.,]\d+)?)\s*ano/); return /beb[eê]/i.test(p)?0:(m?parseFloat(m[1].replace(',','.')):4); }); }
const money=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function renderBuy(){
  const sim=ROWS.filter(r=>r['Presença']==='SIM'); let ad=0, kid=0, baby=0;
  sim.forEach(r=>{ const h=head(r); ad+=h.ad; const ag=ages(r); ag.forEach(a=>a<2?baby++:kid++); if(ag.length<h.cr) kid+=h.cr-ag.length; });
  const A=ad+P.extraA, K=kid+P.extraC, B=baby, m=1+P.marg/100, pes=A+K+B, beerA=Math.round(A*P.beer/100);
  const un=u=>u==='ml'?' ml':u==='g'?' g':u==='kg'?' kg':'';
  // id, nome, unidade, por adulto, por criança, por bebê, embalagem, qtd/embalagem, [base de adultos], [legenda]
  const IT=[
   ['salg','🥟 Salgadinhos fritos','un',12*(1-P.emp/100),8*(1-P.emp/100),0,'cento',100],
   ['emp','🥧 Empadas','un',12*(P.emp/100)/1.5,8*(P.emp/100)/1.5,0,'bandeja 25',25,null,P.emp+'% dos salgados (1 empada = 1,5 frito)'],
   ['doce','🍬 Docinhos','un',5,6,0,'cento',100],
   ['bolo','🎂 Bolo','g',100,100,0,'kg',1000],
   ['refri','🥤 Refrigerante','ml',600,400,0,'PET 2 L',2000],
   ['suco','🧃 Suco','ml',300,400,0,'litro',1000],
   ['agua','💧 Água','ml',300,300,100,'garrafa 500 ml',500],
   ['cerv','🍺 Cerveja','ml',1050,0,0,'lata 350 ml',350,beerA,'3 latas × '+beerA+' adultos que bebem'],
   ['gelo','🧊 Gelo','kg',0.5,0.3,0,'saco 5 kg',5],
   ['lemb','🎁 Lembrancinhas','un',P.lemb==='t'?1:0,1,1,'unidade',1,null,P.lemb==='t'?'1 por pessoa':'1 por criança e bebê'],
   ['copo','🥤 Copos descartáveis','un',3,3,1,'pacote 50',50],
   ['prato','🍽️ Pratinhos','un',2,2,0,'pacote 50',50],
   ['guard','🧻 Guardanapos','un',3,3,1,'pacote 50',50],
  ];
  let total=0, ativos=0; const EXP=[];
  const rows=IT.map(([id,nm,u,fa,fk,fb,pk,pq,base,leg])=>{ const on=ON[id]!==false; const a=base!=null?base:A; const tot=(a*fa+K*fk+B*fb)*(id==='lemb'?1:m); const n=Math.ceil(tot/pq); const pr=+PR[id]||0, cost=on?n*pr:0; if(on){ total+=cost; ativos++; EXP.push({nm:nm.replace(/^\S+\s/,''),n,pk,pr,cost,fn:FN[id]||''}); }
    const show=u==='ml'?(tot/1000).toFixed(1)+' L':u==='g'?(tot/1000).toFixed(1)+' kg':Math.ceil(tot)+(u==='kg'?' kg':' un');
    return `<tr class="${on?'':'off'}"><td><label class="sw"><input type="checkbox" data-on="${id}" ${on?'checked':''}> ${nm}</label><small>${leg||(+fa.toFixed(1))+un(u)+' por adulto · '+(+fk.toFixed(1))+un(u)+' por criança'}</small></td>
      <td class="n">${on?show:'—'}</td><td class="n buy"><b>${on?n:'—'}</b><small>${pk}</small></td>
      <td class="n"><input class="pr" type="number" inputmode="decimal" min="0" step="0.01" data-pr="${id}" value="${pr||''}" placeholder="R$"><small>${on&&pr?money(cost):'por '+pk}</small><input class="fn" data-fn="${id}" value="${esc(FN[id]||'')}" placeholder="fornecedor"></td></tr>`; }).join('');
  const seats=Math.ceil((A+K)*P.seat/100), sets=Math.ceil(seats/4), setCost=sets*(+PR.set||0); total+=ON.set===false?0:setCost; if(ON.set!==false) EXP.push({nm:'Jogo mesa + 4 cadeiras (aluguel)',n:sets,pk:'jogos',pr:+PR.set||0,cost:setCost,fn:FN.set||''});
  window.__exp={EXP,total,pes,A,K,B};
  $('#buy').innerHTML=`
  <div class="kpi"><div><b>${pes}</b><small>PESSOAS PREVISTAS</small></div><div><b>${A}</b><small>ADULTOS</small></div><div><b>${K}${B?'+'+B:''}</b><small>CRIANÇAS${B?' + BEBÊS':''}</small></div></div>
  <p class="muted" style="margin:-6px 0 10px">Confirmados na planilha: ${ad} adultos, ${kid} crianças${baby?', '+baby+' bebê(s) (até 2 anos, só contam em água, copo e lembrancinha)':''}${P.extraA+P.extraC?` + sua estimativa de ${P.extraA} adultos e ${P.extraC} crianças`:''}.</p>
  <div class="pbox">
    <div style="font-size:12px;opacity:.8;line-height:1.4">Sua estimativa de quem ainda pode confirmar (deixe 0 para calcular só com os confirmados):</div>
    <label>+ adultos (estimativa sua) <input type="number" min="0" data-p="extraA" value="${P.extraA}"></label>
    <label>+ crianças (estimativa sua) <input type="number" min="0" data-p="extraC" value="${P.extraC}"></label>
    <label>Empadas (% dos salgados) <input type="number" min="0" max="50" data-p="emp" value="${P.emp}"></label>
    <label>Margem de segurança (%) <input type="number" min="0" max="50" data-p="marg" value="${P.marg}"></label>
    <label>Adultos que bebem cerveja (%) <input type="number" min="0" max="100" data-p="beer" value="${P.beer}"></label>
    <label>Lugares sentados (% dos convidados) <input type="number" min="30" max="100" data-p="seat" value="${P.seat}"></label>
    <label>Lembrancinha para <select data-p="lemb"><option value="c" ${P.lemb==='c'?'selected':''}>só crianças</option><option value="t" ${P.lemb==='t'?'selected':''}>todos</option></select></label>
  </div>
  <div class="tot">💰 Orçamento dos itens marcados: <b>${money(total)}</b><small>${ativos} itens + aluguel · preencha os preços na última coluna</small><small id="savest" style="color:#2f8a3a">${CFG_LOADED?'✔ salvo na nuvem (abre igual em qualquer celular)':'carregando o que você já preencheu…'}</small></div>
  <div class="bar"><button class="b-blue" id="expWa" style="flex:1">📲 Enviar lista</button><button id="expCsv">⬇ Planilha</button><button id="expPr">🖨 PDF</button></div>
  <div class="sec px">🪑 ALUGUEL</div>
  <table><tr><th>Item</th><th class="n">Cálculo</th><th class="n">Alugar</th><th class="n">Preço</th></tr>
   <tr class="${ON.set===false?'off':''}"><td><label class="sw"><input type="checkbox" data-on="set" ${ON.set===false?'':'checked'}> Jogo mesa + 4 cadeiras</label><small>${seats} lugares ÷ 4 (bebês no colo)</small></td><td class="n">${seats} cadeiras</td><td class="n buy"><b>${sets}</b><small>jogos</small></td><td class="n"><input class="pr" type="number" inputmode="decimal" min="0" step="0.01" data-pr="set" value="${PR.set||''}" placeholder="R$"><small>${PR.set?money(setCost):'por jogo'}</small><input class="fn" data-fn="set" value="${esc(FN.set||'')}" placeholder="fornecedor"></td></tr></table>
  <div class="sec px">🛒 LISTA DE COMPRAS <span style="color:#fff;opacity:.7">(desmarque o que não vai oferecer)</span></div>
  <table><tr><th>Item</th><th class="n">Consumo</th><th class="n">Comprar</th><th class="n">Preço un.</th></tr>${rows}</table>
  <p class="fonte">Base: 12 salgados e 5–6 docinhos por adulto, 8 salgados e 6–7 docinhos por criança, 100–120 g de bolo, PET de refri para 4 adultos, 3 unidades de cerveja por adulto que bebe (bufês infantis e calculadora Receiteria). Ajustado para 4 h de festa e crianças pequenas. Quantidades já incluem a margem. Preços e fornecedores que você digitar ficam salvos na planilha (aba Config) e aparecem em qualquer celular. Pontual Doces (9 9283-1747): salgados R$ 88 o cento (mín. 30 un), docinhos R$ 140 o cento (mín. 25 por sabor, pedir com 3 dias), mini churros R$ 76 o cento; combo 14 = 100 salgados + Coca 2 L por R$ 99,80.</p>`;
  $('#buy').querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{ P[i.dataset.p]=i.tagName==='SELECT'?i.value:(+i.value||0); saveB(); renderBuy(); });
  $('#buy').querySelectorAll('[data-on]').forEach(i=>i.onchange=()=>{ ON[i.dataset.on]=i.checked; saveB(); renderBuy(); });
  $('#buy').querySelectorAll('[data-pr]').forEach(i=>i.onchange=()=>{ PR[i.dataset.pr]=+String(i.value).replace(',','.')||0; saveB(); renderBuy(); });
  $('#buy').querySelectorAll('[data-fn]').forEach(i=>i.onchange=()=>{ FN[i.dataset.fn]=i.value.trim().slice(0,40); saveB(); });
  const txt=()=>{ const x=window.__exp; return `🛒 LISTA DE COMPRAS — Festa do Vitor (24/10)\n${x.pes} pessoas (${x.A} adultos, ${x.K} crianças${x.B?', '+x.B+' bebês':''})\n\n`+x.EXP.map(e=>`• ${e.nm}: ${e.n} ${e.pk}${e.pr?' × '+money(e.pr)+' = '+money(e.cost):''}${e.fn?' ('+e.fn+')':''}`).join('\n')+`\n\nTOTAL: ${money(x.total)}`; };
  $('#expWa').onclick=async()=>{ const t=txt(); try{ if(navigator.share){ await navigator.share({title:'Lista de compras',text:t}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank'); };
  $('#expCsv').onclick=()=>{ const x=window.__exp; const csv=['Item;Quantidade;Embalagem;Preço unit.;Custo;Fornecedor',...x.EXP.map(e=>[e.nm,e.n,e.pk,String(e.pr).replace('.',','),String(e.cost.toFixed(2)).replace('.',','),e.fn].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')),`"TOTAL";;;;"${x.total.toFixed(2).replace('.',',')}";`].join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})); a.download='lista-compras-vitor4.csv'; a.click(); };
  $('#expPr').onclick=()=>window.print();
}
let KD={}, KO='', DUP=[];
function showK(){ const d=$('#kdet'); if(!KO||!KD[KO]){ d.classList.add('hide'); return; } const [t,items]=KD[KO]; d.classList.remove('hide'); d.innerHTML=`<h4>${t} (${items.length})</h4>`+(items.length?`<ul>${items.map((x,i)=>`<li>${i+1}. ${x}</li>`).join('')}</ul>`:'<p class="muted">Nada aqui ainda.</p>'); }
$('#kpi').addEventListener('click',e=>{ const c=e.target.closest('[data-k]'); if(!c) return; KO=KO===c.dataset.k?'':c.dataset.k; $('#kpi').querySelectorAll('div[data-k]').forEach(x=>x.classList.toggle('on',x.dataset.k===KO)); showK(); });
function showLogin(msg){ $('#app').classList.add('hide'); $('#login').classList.remove('hide'); if(msg) $('#login p').textContent=msg; }
$('#enter').onclick=()=>{ KEY=$('#tok').value.trim(); if(!KEY) return; try{localStorage.setItem('v4_tok',KEY);}catch(e){} load(); };
$('#go').onclick=load; $('#q').oninput=render;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); F=b.dataset.f; render(); });
$('#csv').onclick=()=>{ if(!ROWS.length) return; const h=['Data/Hora','Nome','Presença','Adultos','Crianças','Quem vem','Restrição alimentar','Recado','Telefone'];
  const csv=[h.join(';'),...ROWS.map(r=>h.map(k=>`"${String((k==='Quem vem'?(r[k]||r['Nomes das crianças']):r[k])??'').replace(/"/g,'""')}"`).join(';'))].join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download='confirmacoes-vitor4.csv'; a.click(); };
if(KEY) load(); else showLogin();
setInterval(()=>{ if(KEY && !document.hidden) load(); },60000);
</script>
</body></html>
